

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090d">
<title>DarkFit AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090d;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px 15px}
main{max-width:650px;margin:auto}
header{text-align:center;padding:24px 0}
.logo{font-size:34px;font-weight:900;letter-spacing:1px}
.logo span{color:#a78bfa}
header p{color:#aaa;font-size:14px}
h2{font-size:19px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
button,select,textarea{font:inherit}
.tabs button{padding:13px 4px;border:1px solid #333340;border-radius:12px;background:#15151d;color:#ddd;cursor:pointer;font-size:13px}
.tabs button.active{background:#6d28d9;border-color:#a78bfa;color:white}
.panel{background:#13131b;border:1px solid #292936;border-radius:18px;padding:19px}
label{display:block;margin:17px 0 9px;font-size:14px}
select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #393947;background:#0c0c12;color:white;outline:none}
textarea{min-height:125px;resize:vertical;line-height:1.9}
.primary{width:100%;margin-top:17px;padding:15px;border:0;border-radius:12px;background:#7c3aed;color:white;font-weight:bold;cursor:pointer}
.secondary{width:100%;margin-top:10px;padding:12px;border:1px solid #393947;border-radius:12px;background:#1b1b26;color:white;cursor:pointer}
.result{display:none;margin-top:20px}
.result textarea{min-height:190px}
.note{font-size:12px;color:#aaa;line-height:1.9;margin-top:18px}
footer{text-align:center;color:#666;font-size:12px;padding:25px 0}
</style>
</head>
<body>
<main>
<header>
<div class="logo">DARKFIT <span>AI</span></div>
<p>استودیوی هوش مصنوعی برای ایده‌های خلاقانه</p>
</header>

<h2>استودیوی خلاقیت</h2>
<p style="color:#aaa;font-size:14px">نوع پروژه را انتخاب کن و ایده‌ات را بنویس.</p>

<div class="tabs">
<button class="active" data-type="image">ساخت تصویر</button>
<button data-type="video">ساخت ویدیو</button>
<button data-type="reel">ایده ریلز</button>
</div>

<section class="panel">
<label for="style">سبک موردنظر</label>
<select id="style">
<option value="سینمایی، واقع‌گرایانه و حرفه‌ای">سینمایی و واقع‌گرایانه</option>
<option value="تاریک، حماسی و فانتزی">تاریک و حماسی</option>
<option value="طبیعی، مینیمال و شیک">طبیعی و مینیمال</option>
<option value="پر انرژی، ورزشی و انگیزشی">ورزشی و انگیزشی</option>
</select>

<label for="idea">توضیحات ایده</label>
<textarea id="idea" placeholder="ایده‌ات را اینجا بنویس..."></textarea>

<button class="primary" id="generate">آماده‌سازی پرامپت</button>

<div class="result" id="result">
<label for="output">پرامپت آماده‌شده</label>
<textarea id="output" readonly></textarea>
<button class="secondary" id="copy">کپی پرامپت</button>
</div>
</section>

<p class="note">این نسخه پرامپت تولید می‌کند. برای ساخت واقعی تصویر و ویدیو باید موتور هوش مصنوعی مناسب به پروژه متصل شود.</p>
<footer>DarkFit AI · Creative Studio</footer>
</main>

<script>
let type="image";
const tabs=document.querySelectorAll("[data-type]");
const idea=document.getElementById("idea");
const output=document.getElementById("output");
const result=document.getElementById("result");

const placeholders={
image:"مثلاً: پرتره بدنسازی من در باشگاه تاریک با نور سینمایی...",
video:"مثلاً: ویدیوی سینمایی از تمرین سنگین من با حرکت دوربین...",
reel:"مثلاً: یک ریلز بدنسازی با شروع شوکه‌کننده و پایان قدرتمند..."
};

tabs.forEach(button=>{
button.addEventListener("click",()=>{
type=button.dataset.type;
tabs.forEach(b=>b.classList.toggle("active",b===button));
idea.placeholder=placeholders[type];
result.style.display="none";
});
});

document.getElementById("generate").addEventListener("click",()=>{
const text=idea.value.trim();
if(!text){
idea.focus();
idea.placeholder="اول ایده‌ات را اینجا بنویس...";
return;
}
const style=document.getElementById("style").value;
const instructions={
image:"یک پرامپت حرفه‌ای برای تولید تصویر بنویس. جزئیات نورپردازی، ترکیب‌بندی، کیفیت و حفظ ظاهر واقعی سوژه را مشخص کن.",
video:"یک پرامپت حرفه‌ای برای تولید ویدیو بنویس. حرکت دوربین، حرکات سوژه، نورپردازی، زمان‌بندی و پایان‌بندی را مشخص کن.",
reel:"یک سناریوی جذاب برای ریلز اینستاگرام بنویس. شروع گیرنده، صحنه‌ها، متن روی ویدیو، پیشنهاد موسیقی، کپشن و دعوت به تعامل را ارائه کن."
};
output.value=instructions[type]+"\nسبک بصری: "+style+"\nایده اصلی: "+text+"\nخروجی را با جزئیات دقیق و مناسب ابزارهای هوش مصنوعی آماده کن.";
result.style.display="block";
result.scrollIntoView({behavior:"smooth",block:"nearest"});
});

document.getElementById("copy").addEventListener("click",async()=>{
try{
await navigator.clipboard.writeText(output.value);
document.getElementById("copy").textContent="کپی شد ✓";
}catch(e){
output.focus();
output.select();
document.getElementById("copy").textContent="متن انتخاب شد؛ کپی کن";
}
});
</script>
</body>
</html>
